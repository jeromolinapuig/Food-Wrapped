<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Metallic bronze gradient for the outer ring -->
    <linearGradient id="bronzeOuter" x1="120" y1="80" x2="392" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A2A1A"></stop>
      <stop offset="0.2" stop-color="#B87333"></stop>
      <stop offset="0.4" stop-color="#E2A06B"></stop>
      <stop offset="0.6" stop-color="#A65A2B"></stop>
      <stop offset="1" stop-color="#5C331B"></stop>
    </linearGradient>

    <!-- Subtle polished sheen -->
    <linearGradient id="bronzeSheen" x1="170" y1="90" x2="342" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"></stop>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.08"></stop>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"></stop>
      <stop offset="0.78" stop-color="#FFFFFF" stop-opacity="0.1"></stop>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"></stop>
    </linearGradient>

    <!-- Light bronze inner ring -->
    <linearGradient id="bronzeInner" x1="160" y1="110" x2="352" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD2A6"></stop>
      <stop offset="0.5" stop-color="#D18A54"></stop>
      <stop offset="1" stop-color="#F3B07A"></stop>
    </linearGradient>

    <!-- Sparkle glow -->
    <radialGradient id="sparkGlowBronze" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
      <stop offset="0.4" stop-color="#FFE3C7" stop-opacity="0.7"></stop>
      <stop offset="1" stop-color="#FFE3C7" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Mask: keep only the ring area, center transparent -->
    <mask id="ringMask">
      <rect width="512" height="512" fill="black"></rect>
      <circle cx="256" cy="256" r="238" fill="white"></circle>
      <circle cx="256" cy="256" r="210" fill="black"></circle>
      <rect x="216" y="28" width="80" height="80" fill="white"></rect>
    </mask>
  </defs>

  <!-- OUTER RING -->
  <g mask="url(#ringMask)">
    <circle cx="256" cy="256" r="224" fill="none" stroke="url(#bronzeOuter)" stroke-width="28"></circle>
    <circle cx="256" cy="256" r="224" fill="none" stroke="url(#bronzeSheen)" stroke-width="10" opacity="0.55"></circle>
  </g>

  <!-- Sparkles -->
  <g mask="url(#ringMask)" opacity="0.9">
    <g transform="translate(150 150) rotate(-20)">
      <circle cx="0" cy="0" r="14" fill="url(#sparkGlowBronze)" opacity="0.7"></circle>
      <path d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z" fill="#FFFFFF" opacity="0.85"></path>
    </g>

    <g transform="translate(305 140) rotate(15)">
      <circle cx="0" cy="0" r="11" fill="url(#sparkGlowBronze)" opacity="0.55"></circle>
      <path d="M0 -8 L1.6 -1.6 L8 0 L1.6 1.6 L0 8 L-1.6 1.6 L-8 0 L-1.6 -1.6 Z" fill="#FFFFFF" opacity="0.8"></path>
    </g>

    <g transform="translate(220 260) rotate(30)">
      <circle cx="0" cy="0" r="10" fill="url(#sparkGlowBronze)" opacity="0.45"></circle>
      <path d="M0 -7 L1.4 -1.4 L7 0 L1.4 1.4 L0 7 L-1.4 1.4 L-7 0 L-1.4 -1.4 Z" fill="#FFFFFF" opacity="0.75"></path>
    </g>

    <g transform="translate(355 325) rotate(-10)">
      <circle cx="0" cy="0" r="13" fill="url(#sparkGlowBronze)" opacity="0.6"></circle>
      <path d="M0 -9 L1.8 -1.8 L9 0 L1.8 1.8 L0 9 L-1.8 1.8 L-9 0 L-1.8 -1.8 Z" fill="#FFFFFF" opacity="0.82"></path>
    </g>

    <g transform="translate(170 360) rotate(25)">
      <circle cx="0" cy="0" r="8" fill="url(#sparkGlowBronze)" opacity="0.35"></circle>
      <path d="M0 -6 L1.2 -1.2 L6 0 L1.2 1.2 L0 6 L-1.2 1.2 L-6 0 L-1.2 -1.2 Z" fill="#FFFFFF" opacity="0.7"></path>
    </g>
  </g>
</svg>